<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mermaid Live Editor</title>
    <link rel="stylesheet" href="/css/campaign-display.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/loader.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #111;
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    .hint {
      margin: 0 0 16px;
      color: #555;
    }
    .page {
      display: grid;
      gap: 16px;
    }
    .panel {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      background: white;
      padding: 12px;
    }
    .chart-panel {
      min-height: 560px;
      overflow: auto;
    }
    .editor-panel {
      min-height: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #1f6feb;
      color: white;
      font-size: 14px;
    }
    button.secondary {
      background: #6b7280;
    }
    .statusRow {
      margin: 0 0 12px;
      font-size: 13px;
      color: #444;
    }
    .statusRow.error {
      color: #b42318;
    }
    .mermaid {
      overflow-x: auto;
    }
    #mermaidEditorMount {
      min-height: 240px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      overflow: hidden;
    }
    @media (max-width: 1000px) {
      body {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Mermaid Live Editor</h1>
    <p class="hint">The diagram renders above. Edit the Mermaid text below and it redraws automatically.</p>

    <div class="page">
      <div class="panel chart-panel">
        <div id="status" class="statusRow">Loading editor...</div>
        <div id="chart"></div>
      </div>

      <div class="panel editor-panel">
        <div class="toolbar">
          <button id="loadSampleBtn" type="button" class="secondary">Load sample</button>
        </div>
        <div id="mermaidEditorMount"></div>
      </div>
    </div>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
  </script>
  <script src="/scripts/mermaid-editor.js"></script>

    <script src="/nav.js"></script>
    <script src="/scripts/site-shell.js"></script>
</body>
</html>
