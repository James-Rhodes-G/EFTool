<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conversation Gantt</title>
    <link rel="stylesheet" href="/css/campaign-display.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #111;
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    .hint {
      margin: 0 0 16px;
      color: #555;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #1f6feb;
      color: white;
      font-size: 14px;
    }
    button.secondary {
      background: #6b7280;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    textarea, pre, .panel {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      background: white;
    }
    textarea, pre {
      min-height: 600px;
      padding: 12px;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.4;
      overflow: auto;
    }
    textarea {
      resize: vertical;
    }
    .panel {
      padding: 12px;
      min-height: 600px;
      overflow: auto;
    }
    .statusRow {
      margin: 0 0 12px;
      font-size: 13px;
      color: #444;
    }
    .statusRow .error {
      color: #b42318;
    }
    .mermaid {
      overflow-x: auto;
    }
    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Conversation Gantt</h1>
    <p class="hint">Paste a conversation JSON payload. Each participant becomes a Gantt section and each segment becomes a bar, ordered by timestamp.</p>

    <div class="toolbar">
      <button id="renderBtn">Generate chart</button>
      <button id="loadSampleBtn" class="secondary">Load sample</button>
    </div>

    <div class="grid">
      <textarea id="conversationJson" spellcheck="false" placeholder="Paste conversation JSON here..."></textarea>
      <div class="panel">
        <div id="status" class="statusRow">Idle</div>
        <pre id="mermaidCode"></pre>
        <div id="chart"></div>
      </div>
    </div>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
  </script>
  <script src="/scripts/conversation-gantt.js"></script>

    <script src="/nav.js"></script>
    <script src="/scripts/site-shell.js"></script>
</body>
</html>
