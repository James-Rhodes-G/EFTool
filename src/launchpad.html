<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesys Launchpad</title>
    <link rel="stylesheet" href="/css/campaign-display.css">
    <style>
        :root {
            --bg: #eef4f8;
            --panel: #ffffff;
            --text: #17324b;
            --accent: #0b5cab;
            --accent-dark: #073a6d;
            --border: #cbd8e4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Avenir Next", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(11, 92, 171, 0.18), transparent 28%),
                linear-gradient(180deg, #f7fafc 0%, var(--bg) 100%);
            color: var(--text);
        }

        .panel {
            width: min(560px, calc(100vw - 32px));
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 18px 48px rgba(23, 50, 75, 0.12);
            padding: 40px 28px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 36px;
        }

        p {
            margin: 0 0 28px;
            line-height: 1.5;
            color: #547088;
        }

        .actions {
            display: grid;
            gap: 16px;
        }

        a {
            display: block;
            padding: 16px 18px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
        }

        a.secondary {
            color: var(--accent-dark);
            background: #e9f1f9;
        }
    </style>
</head>
<body>
    <main class="panel">
        <h1>Genesys Launchpad</h1>
        <p>Select where to go next.</p>
        <div class="actions">
            <a href="https://localhost/example.html">Return to Embedded Framework</a>
            <a class="secondary" href="https://apps.usw2.pure.cloud/directory/#/analytics">Genesys UI</a>
        </div>
    </main>

    <script src="/nav.js"></script>
    <script src="/scripts/site-shell.js"></script>
</body>
</html>
